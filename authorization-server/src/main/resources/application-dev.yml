server:
  port: 9000

spring:
  application:
    name: platform-authorization-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/platform-boot?serverTimezone=GMT%2B8
    username: ${DB_USERNAME:platform-boot}
    password: ${DB_PASSWORD:platform-boot}
    hikari:
      connection-timeout: 60000
      validation-timeout: 3000
      idle-timeout: 60000
      login-timeout: 5
      max-lifetime: 60000
      maximum-pool-size: 10
      minimum-idle: 10
      read-only: false


  security:
    oauth2:
      client:
        registration:
          google-idp:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: openid, https://www.googleapis.com/auth/userinfo.profile, https://www.googleapis.com/auth/userinfo.email
            client-name: Sign in with Google
          github-idp:
            provider: github
            client-id: ${GITHUB_CLIENT_ID:github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret}
            scope: user:email, read:user
            client-name: Sign in with GitHub
          gitee:
            provider: gitee
            client-name: Sign in with Gitee
            authorization-grant-type: authorization_code
            client-id: ${GITEE_CLIENT_ID:gitee-client-id}
            client-secret: ${GITEE_CLIENT_SECRET:gitee-client-secret}
            redirect-uri: http://127.0.0.1:9000/login/oauth2/code/gitee
            scope: emails, user_info
        provider:
          google:
            user-name-attribute: email
          github:
            user-name-attribute: login
          gitee:
            # 设置用户信息名称对应的字段属性
            user-name-attribute: name
            # 获取用户信息的地址
            user-info-uri: https://gitee.com/api/v5/user
            # 获取token的地址  
            token-uri: https://gitee.com/oauth/token
            # 发起授权申请的地址
            authorization-uri: https://gitee.com/oauth/authorize


